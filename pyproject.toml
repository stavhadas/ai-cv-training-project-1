[project]
name = "pcbi"
version = "0.1.0"
description = "Bench-top PCB solder-joint inspector and CPU-latency backbone benchmark."
requires-python = ">=3.10"   # loose on purpose: Kaggle's Python may differ from the laptop's
dependencies = [
    "typer",
    "psutil",
    "wandb>=0.30.0",
    "py-cpuinfo>=9.0.0",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "imagehash>=4.3.2",
    "torch>=2.14.0",
    "timm>=1.0.29",
    "numpy>=2.2.6",
    "scikit-learn>=1.6",
]

[project.scripts]
pcbi = "pcbi.cli:app"        # typing `pcbi` runs the Typer app defined in src/pcbi/cli.py

[dependency-groups]
# `kaggle` is dev-only: it uploads the crops (`pcbi publish-crops`) and nothing at runtime needs
# it. Kaggle itself clones this repo to train, and an uploader has no business in that environment.
dev = ["ruff", "pytest", "kaggle"]

# torch's default PyPI wheel on Linux is the CUDA build — ~900MB plus ~2.5GB of nvidia libs, which
# CI would download on every push. This project measures CPU latency and `pcbi group --method embed`
# runs 200 images through a small CNN, so the CPU build is the right one everywhere here. Stage 2's
# Kaggle GPU training will need its own torch handling; Kaggle images already ship a CUDA torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true              # only packages routed below use this index

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbi"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, import sort, pyupgrade, bugbear

[tool.ruff.lint.flake8-bugbear]
# B008 exists to catch mutable defaults. Typer's API *is* calls in argument defaults, and a Path
# built from a literal is immutable, so both are safe here.
extend-immutable-calls = ["pathlib.Path", "typer.Option", "typer.Argument"]
